# EmberSign location block for an existing 443 server (path deployments).
# The live slot's port comes from /etc/nginx/snippets/ember-port.conf (blue/green, switched by deploy.sh).
location ~ ^/ember(/|$) {
  auth_basic off;
  include /etc/nginx/snippets/ember-port.conf;
  proxy_pass http://127.0.0.1:$ember_port;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;          # chat streams over SSE
  proxy_read_timeout 300s;
  client_max_body_size 1m;
}
